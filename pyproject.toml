[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Patient, hospital, robot, and simulation-ready digital twin modules."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "boto3",
  "requests",
  "tqdm",
  # patient_digital_twin.scan_volume imports it; same pin as patient-digital-twin/pyproject.toml.
  "xray_simulator @ git+https://github.com/isaac-for-healthcare/i4h-sensor-simulation.git@d7d3f2976ab306a531730772c1d4fa221d6e2247#subdirectory=xray-simulator",
]

[project.optional-dependencies]
patient-dicom = ["SimpleITK>=2.3.0"]
patient-nvsegment = ["torch>=2.4", "monai>=1.5", "pytorch-ignite>=0.5", "fire>=0.6", "einops>=0.7", "huggingface_hub>=0.20", "matplotlib>=3.7", "tqdm>=4.65", "scipy>=1.10"]
patient-nvgenerate = ["torch>=2.4", "monai>=1.5", "einops>=0.7", "huggingface_hub>=0.20", "matplotlib>=3.7", "tqdm>=4.65", "fire>=0.5", "tensorboard>=2.14", "scipy>=1.10"]
patient-pipeline = ["usd-core>=24.3; sys_platform != 'linux' or platform_machine != 'aarch64'", "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'", "vtk", "scipy>=1.10"]
dev = ["pytest>=8.0", "mypy>=1.10", "pydicom>=2.4", "usd-core>=24.3; sys_platform != 'linux' or platform_machine != 'aarch64'", "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'", "vtk", "scipy>=1.10", "SimpleITK>=2.3.0", "trimesh"]  # Everything the test suite exercises.
patient-usd = ["usd-core>=24.3; sys_platform != 'linux' or platform_machine != 'aarch64'", "usd-exchange>=2.2; sys_platform == 'linux' and platform_machine == 'aarch64'"]

[project.scripts]
patient-digital-twin = "patient_digital_twin.__main__:main"
i4h-asset-retrieve = "sim_ready_assets.cli:retrieve_main"

[tool.setuptools]
packages = [
  "hospital_digital_twin",
  "patient_digital_twin",
  "robot_digital_twin",
  "sim_ready_assets",
]
package-dir = { hospital_digital_twin = "hospital-digital-twin/hospital_digital_twin", patient_digital_twin = "patient-digital-twin/patient_digital_twin", robot_digital_twin = "robot-digital-twin/robot_digital_twin", sim_ready_assets = "sim-ready-assets/sim_ready_assets" }
include-package-data = true

[tool.setuptools.package-data]
sim_ready_assets = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["patient-digital-twin/tests"]
addopts = "-v --tb=short"
