[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin"
version = "0.1.0"
description = "Patient, hospital, robot, and simulation-ready digital twin modules."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "nibabel>=5.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "boto3",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
patient-pipeline = ["usd-core", "vtk", "scipy>=1.10"]
patient-physics = ["usd-core", "trimesh>=4.0", "fast-simplification>=0.1", "shapely>=2.0", "tetgen>=0.8", "pymeshfix>=0.18"]
dev = ["pytest>=8.0"]
patient-mesh = []  # Compatibility alias: bundled with patient_digital_twin.
patient-usd = ["usd-core"]

[project.scripts]
patient-digital-twin = "patient_digital_twin.main:main"
i4h-asset-retrieve = "i4h_asset_helper.cli:retrieve_main"

[tool.setuptools]
packages = [
  "hospital_digital_twin",
  "i4h_asset_helper",
  "patient_digital_twin",
  "patient_digital_twin.exporters",
  "patient_digital_twin.imaging_to_mesh",
  "patient_digital_twin.importers",
  "patient_digital_twin.legacy_ct",
  "patient_digital_twin.legacy_ct.ct",
  "robot_digital_twin",
  "sim_ready_assets",
]
package-dir = { hospital_digital_twin = "hospital-digital-twin/hospital_digital_twin", i4h_asset_helper = "sim-ready-assets/i4h_asset_helper", patient_digital_twin = "patient-digital-twin/patient_digital_twin", robot_digital_twin = "robot-digital-twin/robot_digital_twin", sim_ready_assets = "sim-ready-assets/sim_ready_assets" }
include-package-data = true

[tool.setuptools.package-data]
i4h_asset_helper = ["*.json"]
"patient_digital_twin.importers" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["patient-digital-twin/tests"]
addopts = "-v --tb=short"
