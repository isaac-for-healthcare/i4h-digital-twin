[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-ready-assets"
version = "0.6.0"
description = "Utility for managing the I4H asset catalog"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "tqdm",
    "requests"
]

[tool.setuptools]
packages = ["sim_ready_assets"]
include-package-data = true

[tool.setuptools.package-data]
"sim_ready_assets" = ["*.json"]

[project.optional-dependencies]
ci = ["pytest", "pytest-cov"]
# Standalone omni.client for the dev Nucleus catalog without Isaac Sim (NVIDIA proprietary license).
nucleus = ["omniverseclient; python_version < '3.13'"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
i4h-asset-retrieve = "sim_ready_assets.cli:retrieve_main"

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 120
py_version = 310
group_by_package = true
# Also declared in the repo root .isort.cfg, which is what the pre-commit run over the whole tree
# reads. Both have to agree or the two invocations demand opposite grouping.
known_first_party = ["sim_ready_assets"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
testpaths = ["sim_ready_assets/tests"]
