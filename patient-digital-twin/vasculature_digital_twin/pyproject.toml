[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vasculature-digital-twin"
version = "0.1.0"
description = "CT ingestion and vessel digital-twin preprocessing utilities."
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
io = [
  "SimpleITK>=2.3",
  "nibabel>=5.0",
]
segmentation = [
  "scikit-image>=0.22",
  "totalsegmentator>=2.7",
  "nibabel>=5.0",
]
mesh = [
  "vtk>=9.2",
  "warp-lang>=1.3",
]
all = [
  "SimpleITK>=2.3",
  "nibabel>=5.0",
  "scikit-image>=0.22",
  "totalsegmentator>=2.7",
  "vtk>=9.2",
  "warp-lang>=1.3",
]
dev = [
  "pytest>=7.0.0",
  "build>=1.0.0",
  "twine>=5.0.0",
  "scikit-image>=0.22",
  "nibabel>=5.0",
  "pydicom>=2.4",
  "SimpleITK>=2.3",
]

[project.scripts]
vdt-preprocess-ct = "vasculature_digital_twin.cli.preprocess_ct:main"
vdt-segment-vessels = "vasculature_digital_twin.cli.segment_vessels:main"

# Deprecated compatibility build. This directory is the package itself (it also ships in the
# patient-digital-twin distribution); this file keeps path installs of
# `patient-digital-twin/vasculature_digital_twin`, as used by i4h-workflows main, working
# with the same distribution name, version, and dependencies as before.
[tool.setuptools]
package-dir = { "vasculature_digital_twin" = "." }
packages = ["vasculature_digital_twin", "vasculature_digital_twin.cli", "vasculature_digital_twin.ct"]
