[project]
name = "generate-imaging"
version = "0.1.0"
description = "Generate synthetic CT/MR volumes and segmentation masks with MAISI."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "i4h" }]
dependencies = [
  "einops==0.7.0",
  "huggingface-hub==1.28.0",
  "itk==5.4.0",
  "monai[fire]==1.6.0",
  "nibabel==5.2.1",
  "requests==2.34.2",
  "scikit-image==0.23.2",
  "torch==2.13.0",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
