# isort resolves its settings relative to the paths it is given, so the pre-commit run over the
# whole tree never reads sim-ready-assets/pyproject.toml and cannot tell that i4h_asset_helper is
# local. Naming it here keeps the classification identical whether isort is run from the repo root
# or pointed at sim-ready-assets; otherwise the two invocations demand opposite grouping for a
# first-party import. The other projects are left alone: adding them would reclassify imports
# across patient-digital-twin, which is a separate change.
[settings]
known_first_party = i4h_asset_helper
