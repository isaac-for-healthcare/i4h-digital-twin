[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-digital-twin"
version = "0.1.0"
description = "Robot digital twin Python module."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "i4h" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["robot_digital_twin*"]
