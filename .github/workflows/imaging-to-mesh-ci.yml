name: Imaging to Mesh CI

on:
  push:
    branches: [main]
    paths:
      - "patient-digital-twin/imaging_to_mesh/**"
      - ".github/workflows/imaging-to-mesh-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "patient-digital-twin/imaging_to_mesh/**"
      - ".github/workflows/imaging-to-mesh-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patient-digital-twin/imaging_to_mesh

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: imaging-to-mesh-dist
          path: patient-digital-twin/imaging_to_mesh/dist/
          retention-days: 7
