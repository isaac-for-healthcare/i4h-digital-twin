name: Patient Digital Twin CI

on:
  push:
    branches: [main]
    paths:
      - "patient-digital-twin/patient_digital_twin/**"
      - "patient-digital-twin/tests/**"
      - "patient-digital-twin/examples/**"
      - "patient-digital-twin/pyproject.toml"
      - "patient-digital-twin/uv.lock"
      - "pyproject.toml"
      - ".github/workflows/imaging-to-mesh-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "patient-digital-twin/patient_digital_twin/**"
      - "patient-digital-twin/tests/**"
      - "patient-digital-twin/examples/**"
      - "patient-digital-twin/pyproject.toml"
      - "patient-digital-twin/uv.lock"
      - "pyproject.toml"
      - ".github/workflows/imaging-to-mesh-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patient-digital-twin

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python -m pip install dist/*.whl
          python -I -c "import numpy as np; from patient_digital_twin.imaging_to_mesh import mask_to_mesh; vertices, faces = mask_to_mesh(np.ones((3, 3, 3))); assert len(vertices) and len(faces)"
      - uses: actions/upload-artifact@v4
        with:
          name: patient-digital-twin-dist
          path: patient-digital-twin/dist/
          retention-days: 7
