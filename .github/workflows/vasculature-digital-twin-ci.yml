name: Vasculature Digital Twin CI

on:
  push:
    branches: [main]
    paths:
      - "patient-digital-twin/vasculature_digital_twin/**"
      - ".github/workflows/vasculature-digital-twin-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "patient-digital-twin/vasculature_digital_twin/**"
      - ".github/workflows/vasculature-digital-twin-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patient-digital-twin/vasculature_digital_twin

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, CPU)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests -v --tb=short -m "not gpu"

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build vasculature-digital-twin
        run: |
          python -m build
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vasculature-digital-twin-dist
          path: patient-digital-twin/vasculature_digital_twin/dist/
          retention-days: 7
