name: Patient Digital Twin CI

on:
  push:
    branches: [main]
    paths:
      - "patient-digital-twin/**"
      - "pyproject.toml"
      - ".github/workflows/patient_digital_twin-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "patient-digital-twin/**"
      - "pyproject.toml"
      - ".github/workflows/patient_digital_twin-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patient-digital-twin

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LFS objects (with retries)
        working-directory: .
        run: |
          # GitHub's LFS endpoint occasionally times out; retry with backoff.
          for attempt in 1 2 3 4 5; do
            git lfs pull && exit 0
            echo "git lfs pull failed (attempt $attempt); retrying" >&2
            sleep $((attempt * 20))
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          mypy

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          python -m pip install dist/*.whl
          python -I -c "import numpy as np; from patient_digital_twin.geometry import mask_to_mesh; vertices, faces = mask_to_mesh(np.ones((3, 3, 3))); assert len(vertices) and len(faces)"
      - name: Install from the repository root and import every module
        working-directory: .
        run: |
          python -m venv /tmp/root-install
          /tmp/root-install/bin/python -m pip install --upgrade pip
          /tmp/root-install/bin/python -m pip install .
          cd /tmp && /tmp/root-install/bin/python -I -c "import patient_digital_twin, patient_digital_twin.scan_volume, hospital_digital_twin, robot_digital_twin, sim_ready_assets"
          /tmp/root-install/bin/patient-digital-twin --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: patient-digital-twin-dist
          path: patient-digital-twin/dist/
          retention-days: 7
